<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Joyson Online Emoji Sandbox</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; user-select: none; touch-action: manipulation; }
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #0f1115; color: #fff; font-family: system-ui, sans-serif; overflow: hidden; }

    .modal { position: absolute; inset: 0; background: rgba(15,17,21,0.95); z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; overflow-y: auto; }
    .hidden { display: none !important; }

    .card { background: #1a1d24; border: 1px solid #2a2f3d; border-radius: 12px; padding: 20px; width: 100%; max-width: 440px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
    h2, h3 { text-align: center; margin-top: 0; color: #4caf50; }

    .btn { width: 100%; padding: 12px; margin: 6px 0; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; color: white; text-align: center; transition: 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn-dark-green { background: #1b5e20; }
    .btn-green { background: #4caf50; }
    .btn-yellow { background: #fbc02d; color: #111; }
    .btn-blue { background: #0288d1; }
    .btn-light-green { background: #7cb342; }
    .btn-danger { background: #d32f2f; }
    .btn-purple { background: #673ab7; }

    input, select { width: 100%; padding: 10px; margin: 6px 0; border-radius: 6px; background: #252934; border: 1px solid #3f4659; color: #fff; font-size: 14px; }
    label { font-size: 12px; color: #aaa; margin-top: 6px; display: block; }
    .hint { font-size: 11px; color: #888; text-align: center; margin-bottom: 8px; }

    #game-container { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; background: #15171c; }

    #ui-hud { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; z-index: 10; }
    .hud-badge { background: rgba(0,0,0,0.7); padding: 8px 14px; border-radius: 8px; font-size: 13px; color: #00ffcc; pointer-events: auto; }

    .btn-pvp { pointer-events: auto; padding: 8px 16px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; font-size: 14px; }
    .pvp-on { background: #2e7d32; color: white; }
    .pvp-off { background: #c62828; color: white; }

    .mobile-controls { position: absolute; bottom: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; align-items: flex-end; pointer-events: auto; z-index: 10; }
    #joystick-zone { width: 120px; height: 120px; background: rgba(255,255,255,0.1); border: 2px dashed rgba(255,255,255,0.3); border-radius: 50%; position: relative; touch-action: none; }
    #joystick-stick { width: 44px; height: 44px; background: rgba(255,255,255,0.5); border-radius: 50%; position: absolute; top: 38px; left: 38px; pointer-events: none; }
    .action-btns { display: flex; gap: 10px; align-items: center; }
    .btn-act { width: 54px; height: 54px; border-radius: 50%; border: none; font-size: 22px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
    .btn-spawn-mob { background: #fff; color: #111; font-size: 24px; position: relative; }
    .btn-respawn { background: #fff; color: #111; font-size: 22px; }
    .cooldown-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 15px; color: #fff; font-weight: bold; }
  </style>
</head>
<body>

  <!-- ГЛАВНОЕ МЕНЮ -->
  <div id="main-menu" class="modal">
    <div class="card">
      <h2 id="player-display-name">Игрок ...</h2>
      <div class="hint" id="account-status">Гостевой режим</div>

      <label>Сменить имя пользователя:</label>
      <div style="display:flex; gap:8px;">
        <input type="text" id="username-input" placeholder="Введите ваш ник">
        <button class="btn btn-blue" style="width: auto; padding: 0 15px;" onclick="changeUsername()">ОК</button>
      </div>

      <button class="btn btn-dark-green" onclick="quickSearch()">Найти игроков</button>
      <button class="btn btn-green" onclick="openCharEditor()">Создать персонажа</button>
      <button class="btn btn-light-green" onclick="openMobEditor()">Создать моба</button>
      <button class="btn btn-yellow" onclick="openServerList()">Список серверов</button>
      <button class="btn btn-blue" onclick="openAuthModal()">Регистрация (@gmail.com)</button>
      
      <button id="creator-panel-btn" class="btn btn-purple hidden" onclick="openCreatorModal()">🛠️ Панель Создателя Игры</button>

      <button class="btn btn-blue" onclick="document.getElementById('file-input').click()">Загрузить .joyson</button>
      <input type="file" id="file-input" accept=".joyson,.txt" style="display:none" onchange="uploadJoysonFile(event)">
      
      <label>Выбор активного персонажа:</label>
      <select id="character-select"></select>

      <label>Выбор моба для призыва:</label>
      <select id="mob-select"></select>
    </div>
  </div>

  <!-- ПАНЕЛЬ СОЗДАТЕЛЯ ИГРЫ -->
  <div id="creator-modal" class="modal hidden">
    <div class="card" style="max-width: 500px;">
      <h2>Панель Создателя Игры</h2>
      <h3>Зарегистрированные пользователи</h3>
      <div id="creator-users-container" style="max-height: 180px; overflow-y:auto; border:1px solid #333; border-radius:6px; padding:5px; margin-bottom:15px;"></div>
      <h3>Управление контентом</h3>
      <button class="btn btn-danger" onclick="openContentManager()">Удалить персонажей / мобов</button>
      <button class="btn btn-blue" style="margin-top:15px;" onclick="closeModal('creator-modal')">Закрыть</button>
    </div>
  </div>

  <!-- ОКНО УПРАВЛЕНИЯ КОНТЕНТОМ -->
  <div id="content-manager-modal" class="modal hidden">
    <div class="card">
      <h2>Удаление контента</h2>
      <label>Персонажи:</label>
      <div id="cm-chars-list" style="max-height:120px; overflow-y:auto; border:1px solid #333; margin-bottom:10px; padding:5px;"></div>
      <label>Мобы:</label>
      <div id="cm-mobs-list" style="max-height:120px; overflow-y:auto; border:1px solid #333; margin-bottom:10px; padding:5px;"></div>
      <button class="btn btn-danger" onclick="closeModal('content-manager-modal')">Назад</button>
    </div>
  </div>

  <!-- АДМИНКА СЕРВЕРА -->
  <div id="room-admin-modal" class="modal hidden">
    <div class="card">
      <h2>Админка Сервера</h2>
      <div id="room-players-list" style="max-height:200px; overflow-y:auto; margin-bottom:10px; border:1px solid #333; padding:5px;"></div>
      <button class="btn btn-danger" onclick="closeModal('room-admin-modal')">Закрыть</button>
    </div>
  </div>

  <!-- РЕДАКТОР ПЕРСОНАЖА -->
  <div id="char-editor-modal" class="modal hidden">
    <div class="card">
      <h2>Редактор Персонажа</h2>
      <label>Имя персонажа:</label>
      <input type="text" id="ce-name" value="Мой Герой">
      <label>Эмодзи персонажа (1 эмодзи) ИЛИ картинка:</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="text" id="ce-emoji" placeholder="🤖">
        <button class="btn btn-blue" style="width:auto; padding:8px 12px; margin:0;" onclick="document.getElementById('png-file-input').click()">Загрузить картинку</button>
      </div>
      <div class="hint">желательно PNG</div>
      <input type="file" id="png-file-input" accept="image/png, image/*" style="display:none" onchange="uploadCharImage(event)">
      <label>Scale персонажа (Макс. 2.5):</label>
      <input type="number" id="ce-scale" value="1.0" min="0.2" max="2.5" step="0.1">
      <label>Здоровье HP (Макс. 9999):</label>
      <input type="number" id="ce-hp" value="1000" max="9999">
      <label>Урон (Макс. 999):</label>
      <input type="number" id="ce-damage" value="100" max="999">
      <label>Скорость атаки (Макс. 2.0):</label>
      <input type="number" id="ce-hitspd" value="0.5" max="2.0" step="0.1">
      <label>Скорость перемещения (Макс. 5.0):</label>
      <input type="number" id="ce-speed" value="2.0" max="5.0" step="0.1">
      <label>Дальность атаки (Макс. 17):</label>
      <input type="number" id="ce-range" value="1.5" max="17" step="0.5">
      <label>Тип атаки персонажа:</label>
      <div style="display:flex; gap:15px; margin: 5px 0;">
        <label><input type="radio" name="atk_type" value="melee" checked onchange="toggleRangedOptions(false)"> Ближняя</label>
        <label><input type="radio" name="atk_type" value="ranged" onchange="toggleRangedOptions(true)"> Дальняя</label>
      </div>
      <div id="ranged-options" class="hidden">
        <label>Тип дальнего боя:</label>
        <div style="display:flex; gap:15px; margin: 5px 0;">
          <label><input type="radio" name="rng_mode" value="tracer" checked onchange="toggleProjectileInputs(false)"> Жёлтый трассер</label>
          <label><input type="radio" name="rng_mode" value="proj" onchange="toggleProjectileInputs(true)"> Снаряд</label>
        </div>
        <div id="proj-inputs" class="hidden">
          <label>Эмодзи снаряда (1 эмодзи):</label>
          <input type="text" id="ce-proj-emoji" placeholder="⚡">
          <label>Скорость снаряда (Макс. 20.0):</label>
          <input type="number" id="ce-proj-spd" value="10.0" max="20.0" step="0.5">
          <label>Scale снаряда (Макс. 2.5):</label>
          <input type="number" id="ce-proj-scale" value="0.5" max="2.5" step="0.1">
        </div>
      </div>
      <button class="btn btn-blue" onclick="submitCustomCharacter()">Создать персонажа</button>
      <button class="btn btn-danger" onclick="closeModal('char-editor-modal')">Отмена</button>
    </div>
  </div>

  <!-- РЕДАКТОР МОБА -->
  <div id="mob-editor-modal" class="modal hidden">
    <div class="card">
      <h2>Редактор Моба</h2>
      <label>Поведение моба:</label>
      <div style="display:flex; gap:10px; margin: 5px 0;">
        <label><input type="radio" name="mob_beh" value="pacific" checked onchange="toggleMobAttackFields()"> Мирный</label>
        <label><input type="radio" name="mob_beh" value="passive" onchange="toggleMobAttackFields()"> Пассивный</label>
        <label><input type="radio" name="mob_beh" value="hostile" onchange="toggleMobAttackFields()"> Враждебный</label>
      </div>
      <label>Имя моба:</label>
      <input type="text" id="me-name" value="Дикий Моб">
      <label>Эмодзи моба (1 эмодзи) ИЛИ картинка:</label>
      <div style="display:flex; gap:8px; align-items:center;">
        <input type="text" id="me-emoji" placeholder="👾">
        <button class="btn btn-blue" style="width:auto; padding:8px 12px; margin:0;" onclick="document.getElementById('png-mob-file-input').click()">Загрузить картинку</button>
      </div>
      <div class="hint">желательно PNG</div>
      <input type="file" id="png-mob-file-input" accept="image/png, image/*" style="display:none" onchange="uploadMobImage(event)">
      <label>Scale моба (Макс. 2.5):</label>
      <input type="number" id="me-scale" value="1.0" min="0.2" max="2.5" step="0.1">
      <label>Здоровье HP (Макс. 9999):</label>
      <input type="number" id="me-hp" value="500" max="9999">
      <label>Скорость передвижения (Макс. 5.0):</label>
      <input type="number" id="me-speed" value="1.9" max="5.0" step="0.1">
      <div id="mob-attack-fields" class="hidden">
        <label>Урон моба (Макс. 999):</label>
        <input type="number" id="me-damage" value="50" max="999">
        <label>Скорость атаки (Макс. 2.0):</label>
        <input type="number" id="me-hitspd" value="0.5" max="2.0" step="0.1">
        <label>Дальность атаки (Макс. 17):</label>
        <input type="number" id="me-range" value="1.5" max="17" step="0.5">
        <label>Тип атаки моба:</label>
        <div style="display:flex; gap:15px; margin: 5px 0;">
          <label><input type="radio" name="me_atk_type" value="melee" checked onchange="toggleMobRanged(false)"> Ближний</label>
          <label><input type="radio" name="me_atk_type" value="ranged" onchange="toggleMobRanged(true)"> Дальний</label>
        </div>
        <div id="mob-ranged-box" class="hidden">
          <label>Тип дальнего боя:</label>
          <div style="display:flex; gap:15px; margin: 5px 0;">
            <label><input type="radio" name="me_rng_mode" value="tracer" checked onchange="toggleMobProj(false)"> Жёлтый трассер</label>
            <label><input type="radio" name="me_rng_mode" value="proj" onchange="toggleMobProj(true)"> Снаряд</label>
          </div>
          <div id="mob-proj-box" class="hidden">
            <label>Эмодзи снаряда:</label>
            <input type="text" id="me-proj-emoji" placeholder="☄️">
            <label>Скорость снаряда:</label>
            <input type="number" id="me-proj-spd" value="10.0" max="20" step="0.5">
            <label>Scale снаряда:</label>
            <input type="number" id="me-proj-scale" value="0.5" max="2.5" step="0.1">
          </div>
        </div>
      </div>
      <button class="btn btn-blue" onclick="submitCustomMob()">Создать моба</button>
      <button class="btn btn-danger" onclick="closeModal('mob-editor-modal')">Отмена</button>
    </div>
  </div>

  <!-- СПИСОК СЕРВЕРОВ -->
  <div id="servers-modal" class="modal hidden">
    <div class="card">
      <h2>Список серверов</h2>
      <button class="btn btn-blue" onclick="toggleCreateServerForm()">Создать сервер</button>
      <div id="create-server-box" class="hidden" style="background:#222630; padding:10px; border-radius:8px; margin:10px 0;">
        <input type="text" id="new-server-name" placeholder="Имя сервера">
        <label>Игроков (2-50):</label>
        <input type="number" id="new-server-limit" value="50" min="2" max="50">
        <button class="btn btn-green" onclick="createNewServer()">Подтвердить создание</button>
      </div>
      <div id="server-list-container" style="max-height: 220px; overflow-y:auto; margin:10px 0; border:1px solid #333; border-radius:6px; padding:5px;"></div>
      <button class="btn btn-danger" onclick="closeModal('servers-modal')">Назад</button>
    </div>
  </div>

  <!-- ОКНО АВТОРИЗАЦИИ ПО ПОЧТЕ (С memelover338@gmail.com) -->
  <div id="auth-modal" class="modal hidden">
    <div class="card">
      <h2>Регистрация по Email</h2>
      <label>Введите электронную почту (обязательно с @gmail.com):</label>
      <input type="email" id="auth-email" placeholder="например memelover338@gmail.com">
      <button class="btn btn-green" onclick="submitEmailAuth()">Войти и Сохранить</button>
      <button class="btn btn-danger" onclick="closeModal('auth-modal')">Закрыть</button>
    </div>
  </div>

  <!-- ИГРА -->
  <div id="game-container">
    <canvas id="canvas"></canvas>
    <div id="ui-hud">
      <div class="hud-badge" id="hud-stats">HP: 1000</div>
      <button id="pvp-toggle-btn" class="btn-pvp pvp-on" onclick="togglePvP()">PvP: ON</button>
      <button id="room-admin-btn" class="hud-badge hidden" style="background:#673ab7; cursor:pointer;" onclick="openRoomAdminModal()">👑 Админка</button>
      <button class="hud-badge" style="cursor:pointer;" onclick="leaveServer()">⚙️ В меню</button>
    </div>
    <div class="mobile-controls" id="mobile-ui">
      <div id="joystick-zone"><div id="joystick-stick"></div></div>
      <div class="action-btns">
        <button class="btn-act btn-spawn-mob" id="mob-spawn-btn" onclick="spawnMob()">💀<div id="cooldown-overlay" class="cooldown-overlay hidden">5</div></button>
        <button class="btn-act btn-respawn" onclick="requestRespawn()">🔄</button>
        <button class="btn-act" style="background:#2e7d32;" onclick="spawnBlock()">🟩</button>
        <button class="btn-act" style="background:#c62828;" onclick="triggerAttack()">⚔️</button>
      </div>
    </div>
  </div>

  <script>
    const socket = io();
    let reservedEmojis = [];
    let characterList = [];
    let mobList = [];
    let selectedChar = null;
    let selectedMob = null;
    let mobCooldown = 0;
    let isCreator = false;
    let currentRoomPlayers = {};

    let pvpEnabled = true;
    let player = { x: 0, y: 0, hp: 1000, maxHp: 1000, dirX: 1, dirY: 0, lastAttack: 0 };
    let remotePlayers = {};
    let blocks = [];
    let mobs = [];
    let projectiles = [];
    let tracers = [];

    const TILE_SIZE = 48;
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (!isTouchDevice && !/Android|webOS|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
      document.getElementById('mobile-ui').classList.add('hidden');
    }

    let uploadedCharImgBase64 = null;
    let uploadedMobImgBase64 = null;

    const savedEmail = localStorage.getItem('joyson_user_email');
    if (savedEmail) {
      setTimeout(() => { socket.emit('auth_login', savedEmail); }, 300);
    }

    socket.on('init_data', (data) => {
      if (!savedEmail) {
        document.getElementById('player-display-name').innerText = data.username;
        document.getElementById('username-input').value = data.username;
      }
      reservedEmojis = data.reservedEmojis || [];
      characterList = [];
      mobList = [];
      document.getElementById('character-select').innerHTML = '';
      document.getElementById('mob-select').innerHTML = '';

      loadDefaultJoyson();
      loadMobsJoyson();

      if (data.globalCharacters) {
        data.globalCharacters.forEach(c => addCharacterToList(c));
      }
      if (data.globalMobs) {
        data.globalMobs.forEach(m => addMobToList(m));
      }
    });

    socket.on('auth_success', (data) => {
      document.getElementById('player-display-name').innerText = data.username;
      document.getElementById('username-input').value = data.username;
      document.getElementById('account-status').innerText = `Аккаунт: ${data.email}`;
      isCreator = data.isCreator;
      if (isCreator) {
        document.getElementById('creator-panel-btn').classList.remove('hidden');
      }
      closeModal('auth-modal');
    });

    socket.on('banned_error', (msg) => {
      alert(msg);
      localStorage.removeItem('joyson_user_email');
      location.reload();
    });

    socket.on('username_updated', (newName) => {
      document.getElementById('player-display-name').innerText = newName;
    });

    socket.on('auth_error', (msg) => alert(msg));
    socket.on('char_error', (msg) => alert(msg));
    socket.on('error_msg', (msg) => alert(msg));
    socket.on('action_success', (msg) => alert(msg));

    socket.on('new_global_character', (charData) => {
      addCharacterToList(charData);
      if (charData.emoji) reservedEmojis.push(charData.emoji);
    });

    socket.on('new_global_mob', (mobData) => {
      addMobToList(mobData);
      reservedEmojis.push(mobData.emoji);
    });

    socket.on('server_list', (servers) => {
      const container = document.getElementById('server-list-container');
      container.innerHTML = '';
      if (servers.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:15px; color:#aaa;">пока нет серверов</div>';
        return;
      }
      servers.forEach(s => {
        const item = document.createElement('div');
        item.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:8px; border-bottom:1px solid #333;";
        let delBtn = isCreator ? `<button class="btn btn-danger" style="width:auto; padding:4px 8px; margin:0; margin-left:5px;" onclick="creatorDeleteServer('${s.id}')">Удалить</button>` : '';
        item.innerHTML = `<span><b>${s.name}</b> (${s.currentPlayers}/${s.maxPlayers})</span>
          <div>
            <button class="btn btn-green" style="width:auto; padding:4px 12px; margin:0;" onclick="joinServer('${s.id}')">Играть</button>
            ${delBtn}
          </div>`;
        container.appendChild(item);
      });
    });

    socket.on('joined_room_success', (data) => {
      blocks = data.blocks || [];
      mobs = data.mobs || [];
      remotePlayers = data.players || {};
      delete remotePlayers[socket.id];
      document.getElementById('main-menu').classList.add('hidden');
      document.getElementById('servers-modal').classList.add('hidden');
      document.getElementById('room-admin-btn').classList.remove('hidden');
      resizeCanvas();
      requestAnimationFrame(gameLoop);
    });

    socket.on('room_players_update', (players) => { currentRoomPlayers = players; });
    socket.on('player_joined', (p) => { remotePlayers[p.id] = p; });
    socket.on('player_left', (id) => { delete remotePlayers[id]; });
    socket.on('player_moved', (data) => { if (remotePlayers[data.id]) Object.assign(remotePlayers[data.id], data); });
    socket.on('sync_mobs', (serverMobs) => { mobs = serverMobs; });
    socket.on('sync_blocks', (bList) => blocks = bList);

    socket.on('player_hp_sync', ({ id, hp }) => {
      if (id === socket.id) player.hp = hp;
      else if (remotePlayers[id]) remotePlayers[id].hp = hp;
    });

    socket.on('player_respawned', ({ id, hp, x, y }) => {
      if (id === socket.id) { player.hp = hp; player.x = x; player.y = y; }
      else if (remotePlayers[id]) { remotePlayers[id].hp = hp; remotePlayers[id].x = x; remotePlayers[id].y = y; }
    });

    socket.on('creator_users_list', (users) => {
      const container = document.getElementById('creator-users-container');
      container.innerHTML = '';
      users.forEach(u => {
        const item = document.createElement('div');
        item.style.cssText = "display:flex; justify-content:space-between; align-items:center; padding:6px; border-bottom:1px solid #333; font-size:12px;";

    function parseJoyson(text) {
      const chars = [];
      const cleaned = text.replace(/};\s*$/, '');
      cleaned.split(/(?=\{character:)/g).forEach(b => {
        if (!b.trim()) return;
        const cObj = {};
        b.split('\n').forEach(line => {
          line = line.trim();
          if (line.startsWith('{character:')) cObj.id = line.replace('{character:', '').trim();
          else if (line.includes(':')) {
            const idx = line.indexOf(':');
            const k = line.slice(0, idx).trim();
            let v = line.slice(idx + 1).trim();
            if ((v.startsWith("'") && v.endsWith("'")) || (v.startsWith('"') && v.endsWith('"'))) v = v.slice(1, -1);
            else if (v === 'true') v = true; else if (v === 'false') v = false;
            else if (!isNaN(Number(v))) v = Number(v);
            cObj[k] = v;
          }
        });
        if (cObj.name || cObj.id) chars.push(cObj);
      });
      return chars;
    }

    function isSingleEmoji(str) {

        return [...segmenter.segment(clean)].length === 1;

      return /^\p{Extended_Pictographic}/u.test(clean);
    }

    function selectActiveCharacter() {

    function spawnBlock() {
      const bx = Math.round(player.x + player.dirX * 1.5);
      const by = Math.round(player.y + player.dirY * 1.5);
      socket.emit('spawn_block', { x: bx, y: by, hp: 1000, maxHp: 1000 });

    function triggerAttack() {
      const now = Date.now();
      const cooldown = (selectedChar.hit_spd || 0.5) * 1000;
      if (now - player.lastAttack < cooldown) return;
      player.lastAttack = now;

      if (selectedChar.type === 'ranged') {
        if (selectedChar.isYellowTracer) {
          const rng = selectedChar.range || 15;
          tracers.push({ x1: player.x, y1: player.y, x2: player.x + player.dirX * rng, y2: player.y + player.dirY * rng, life: 1 });
          checkHit(selectedChar.damage, rng);
        } else {
          projectiles.push({
            x: player.x, y: player.y,
            vx: player.dirX * (selectedChar.projectile_spd || 10) * 0.04,
            vy: player.dirY * (selectedChar.projectile_spd || 10) * 0.04,
            emoji: selectedChar.projectile_emoji || '💥',
            scale: selectedChar.projectile_scale || 0.5,
            damage: selectedChar.damage, range: selectedChar.range, startX: player.x, startY: player.y
          });
        }
      } else {
        checkHit(selectedChar.damage, selectedChar.range || 1.5);
      }
    }

    function checkHit(damage, range) {
      blocks.forEach((b, idx) => {
        if (Math.hypot(b.x - player.x, b.y - player.y) <= range) {
          socket.emit('block_damage', { blockIndex: idx, damage });
        }
      });
      mobs.forEach(m => {
        if (Math.hypot(m.x - player.x, m.y - player.y) <= range) {
          socket.emit('deal_mob_damage', { mobId: m.id, damage });
        }
      });
      Object.values(remotePlayers).forEach(rp => {
        if (rp.pvp && Math.hypot(rp.x - player.x, rp.y - player.y) <= range) {
          socket.emit('deal_player_damage', { targetId: rp.id, damage });
        }
      });
    }

    const keys = {};
    window.addEventListener('keydown', e => {
      keys[e.code] = true;
      if (document.getElementById('main-menu').classList.contains('hidden')) {
        if (e.code === 'Space') {
          e.preventDefault();
          spawnMob();
        } else if (e.code === 'KeyR') {
          e.preventDefault();
          requestRespawn();
        }
      }
    });
    window.addEventListener('keyup', e => keys[e.code] = false);

    window.addEventListener('mousedown', (e) => {
      if (document.getElementById('main-menu').classList.contains('hidden')) {
        if (e.button === 0) triggerAttack();
        if (e.button === 2) spawnBlock();
      }
    });
    window.addEventListener('contextmenu', e => e.preventDefault());

    const joyContainer = document.getElementById('joystick-zone');
    const joyStick = document.getElementById('joystick-stick');
    let joyVec = { x: 0, y: 0 };
    if (joyContainer) {
      joyContainer.addEventListener('touchstart', handleJoy);
      joyContainer.addEventListener('touchmove', handleJoy);
      joyContainer.addEventListener('touchend', () => { joyStick.style.transform = 'translate(0,0)'; joyVec = {x:0, y:0}; });
    }

    function handleJoy(e) {
      e.preventDefault();
      const touch = e.touches[0];
      const rect = joyContainer.getBoundingClientRect();
      let dx = touch.clientX - (rect.left + rect.width / 2);
      let dy = touch.clientY - (rect.top + rect.height / 2);
      const maxR = rect.width / 2;
      const len = Math.hypot(dx, dy);
      if (len > maxR) { dx = (dx / len) * maxR; dy = (dy / len) * maxR; }
      joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
      joyVec.x = dx / maxR; joyVec.y = dy / maxR;
      if (Math.hypot(joyVec.x, joyVec.y) > 0.1) {
        const l = Math.hypot(joyVec.x, joyVec.y);
        player.dirX = joyVec.x / l; player.dirY = joyVec.y / l;
      }
    }

    function update() {
      let speed = (selectedChar ? selectedChar.speed : 2) * 0.045;
      let moveX = joyVec.x, moveY = joyVec.y;

      if (keys['KeyW'] || keys['ArrowUp']) moveY = -1;
      if (keys['KeyS'] || keys['ArrowDown']) moveY = 1;
      if (keys['KeyA'] || keys['ArrowLeft']) moveX = -1;
      if (keys['KeyD'] || keys['ArrowRight']) moveX = 1;

      if (moveX !== 0 || moveY !== 0) {
        const len = Math.hypot(moveX, moveY);
        player.dirX = moveX / len; player.dirY = moveY / len;
        player.x += (moveX / len) * speed;
        player.y += (moveY / len) * speed;
        socket.emit('player_update', { x: player.x, y: player.y, dirX: player.dirX, dirY: player.dirY, char: selectedChar, pvp: pvpEnabled, hp: player.hp, maxHp: player.maxHp });
      }

      projectiles.forEach(p => {
        p.x += p.vx; p.y += p.vy;
        blocks.forEach((b, idx) => {
          if (Math.hypot(b.x - p.x, b.y - p.y) < 0.6) {
            socket.emit('block_damage', { blockIndex: idx, damage: p.damage });
            p.dead = true;
          }
        });
        mobs.forEach(m => {
          if (Math.hypot(m.x - p.x, m.y - p.y) < 0.65) {
            socket.emit('deal_mob_damage', { mobId: m.id, damage: p.damage });
            p.dead = true;
          }
        });
        Object.values(remotePlayers).forEach(rp => {
          if (rp.pvp && Math.hypot(rp.x - p.x, rp.y - p.y) < 0.65) {
            socket.emit('deal_player_damage', { targetId: rp.id, damage: p.damage });
            p.dead = true;
          }
        });
        if (Math.hypot(p.x - p.startX, p.y - p.startY) >= p.range) p.dead = true;
      });
      projectiles = projectiles.filter(p => !p.dead);
      tracers.forEach(t => t.life -= 0.08);
      tracers = tracers.filter(t => t.life > 0);
      document.getElementById('hud-stats').innerText = `${selectedChar ? selectedChar.name : 'Игрок'} | HP: ${player.hp}`;
    }

    const imageCache = {};
    function drawEntity(ctx, x, y, entityData, scale = 1) {
      if (entityData && entityData.image) {
        let img = imageCache[entityData.image];
        if (!img) {
          img = new Image();
          img.src = entityData.image;
          imageCache[entityData.image] = img;
        }
        if (img.complete) {
          const size = TILE_SIZE * scale;
          ctx.drawImage(img, x * TILE_SIZE - size / 2, y * TILE_SIZE - size / 2, size, size);
          return;
        }
      }
      const em = entityData ? (entityData.emoji || '👨') : '👨';
      ctx.font = `${TILE_SIZE * scale}px serif`;
      ctx.fillText(em, x * TILE_SIZE, y * TILE_SIZE);
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const viewX = canvas.width / 2 - player.x * TILE_SIZE;
      const viewY = canvas.height / 2 - player.y * TILE_SIZE;
      ctx.save();
      ctx.translate(viewX, viewY);

      const startCol = Math.floor(player.x - canvas.width / (2 * TILE_SIZE) - 2);
      const endCol = Math.ceil(player.x + canvas.width / (2 * TILE_SIZE) + 2);
      const startRow = Math.floor(player.y - canvas.height / (2 * TILE_SIZE) - 2);
      const endRow = Math.ceil(player.y + canvas.height / (2 * TILE_SIZE) + 2);

      ctx.font = `${TILE_SIZE * 0.8}px serif`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

      for (let r = startRow; r <= endRow; r++) {
        for (let c = startCol; c <= endCol; c++) {
          ctx.fillText('🟩', c * TILE_SIZE, r * TILE_SIZE);
        }
      }

      blocks.forEach(b => {
        ctx.fillText('🟩', b.x * TILE_SIZE, b.y * TILE_SIZE);
        ctx.fillStyle = 'red'; ctx.fillRect(b.x * TILE_SIZE - 18, b.y * TILE_SIZE - 25, 36, 4);
        ctx.fillStyle = '#00ff00'; ctx.fillRect(b.x * TILE_SIZE - 18, b.y * TILE_SIZE - 25, 36 * (b.hp / b.maxHp), 4);
      });

      mobs.forEach(m => {
        drawEntity(ctx, m.x, m.y, m, m.scale || 1);
        ctx.font = '11px sans-serif'; ctx.fillStyle = '#ff5555';
        ctx.fillText(m.name || 'Моб', m.x * TILE_SIZE, m.y * TILE_SIZE - 32);

        const mHp = m.hp !== undefined ? m.hp : 500;
        const mMaxHp = m.maxHp || 500;
        ctx.fillStyle = 'red'; ctx.fillRect(m.x * TILE_SIZE - 20, m.y * TILE_SIZE - 25, 40, 5);
        ctx.fillStyle = '#00ff00'; ctx.fillRect(m.x * TILE_SIZE - 20, m.y * TILE_SIZE - 25, 40 * (mHp / mMaxHp), 5);
      });

      tracers.forEach(t => {
        ctx.strokeStyle = `rgba(255, 235, 59, ${t.life})`;
        ctx.lineWidth = 3; ctx.beginPath();
        ctx.moveTo(t.x1 * TILE_SIZE, t.y1 * TILE_SIZE); ctx.lineTo(t.x2 * TILE_SIZE, t.y2 * TILE_SIZE);
        ctx.stroke();
      });

      projectiles.forEach(p => {
        ctx.font = `${TILE_SIZE * (p.scale || 0.5)}px serif`;
        ctx.fillText(p.emoji, p.x * TILE_SIZE, p.y * TILE_SIZE);
      });

      Object.values(remotePlayers).forEach(rp => {
        drawEntity(ctx, rp.x, rp.y, rp.char, rp.char ? (rp.char.scale || 1) : 1);

        ctx.font = '12px sans-serif'; ctx.fillStyle = '#fff';
        ctx.fillText(rp.username || 'Игрок', rp.x * TILE_SIZE, rp.y * TILE_SIZE - 32);

        const rpHp = rp.hp !== undefined ? rp.hp : 1000;
        const rpMaxHp = rp.maxHp || 1000;
        ctx.fillStyle = 'red'; ctx.fillRect(rp.x * TILE_SIZE - 20, rp.y * TILE_SIZE - 25, 40, 5);
        ctx.fillStyle = '#00ff00'; ctx.fillRect(rp.x * TILE_SIZE - 20, rp.y * TILE_SIZE - 25, 40 * (rpHp / rpMaxHp), 5);
      });

      drawEntity(ctx, player.x, player.y, selectedChar, selectedChar ? (selectedChar.scale || 1) : 1);

      ctx.font = '12px sans-serif'; ctx.fillStyle = '#00ffcc';
      ctx.fillText(document.getElementById('player-display-name').innerText, player.x * TILE_SIZE, player.y * TILE_SIZE - 32);

      ctx.fillStyle = 'red'; ctx.fillRect(player.x * TILE_SIZE - 20, player.y * TILE_SIZE - 25, 40, 5);
      ctx.fillStyle = '#00ff00'; ctx.fillRect(player.x * TILE_SIZE - 20, player.y * TILE_SIZE - 25, 40 * (player.hp / player.maxHp), 5);

      ctx.restore();
    }

    function gameLoop() {
      update(); render();
      requestAnimationFrame(gameLoop);
    }

    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resizeCanvas);
  </script>
</body>
</html>
